[project]
name = "agentic-security-scanner"
version = "0.1.0"
description = "Bounded scanning service for the Agentic Security Framework"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.120.0",
  "uvicorn==0.38.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "ruff==0.14.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

