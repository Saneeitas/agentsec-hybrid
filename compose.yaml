name: agentic-security-framework

services:
  scanner:
    build:
      context: ./services/scanner
    environment:
      SCANNER_SERVICE_TOKEN: ${SCANNER_SERVICE_TOKEN:?SCANNER_SERVICE_TOKEN is required}
      ADAPTIVE_PROVIDER: ${ADAPTIVE_PROVIDER:-mock}
      ADAPTIVE_LLM_MODEL: ${ADAPTIVE_LLM_MODEL:-}
      ADAPTIVE_LLM_BASE_URL: ${ADAPTIVE_LLM_BASE_URL:-}
      ADAPTIVE_LLM_API_KEY: ${ADAPTIVE_LLM_API_KEY:-}
      ADAPTIVE_PROVIDER_TIMEOUT_SECONDS: ${ADAPTIVE_PROVIDER_TIMEOUT_SECONDS:-10}
      ADAPTIVE_MAX_PROBES: ${ADAPTIVE_MAX_PROBES:-4}
      ADAPTIVE_MAX_PROVIDER_TOKENS: ${ADAPTIVE_MAX_PROVIDER_TOKENS:-1024}
      ADAPTIVE_MAX_WALL_TIME_MS: ${ADAPTIVE_MAX_WALL_TIME_MS:-5000}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-${DATABASE_URL:?DATABASE_URL is required}}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      API_PORT: "3000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      SCANNER_BASE_URL: http://scanner:8000
      SCANNER_REQUEST_TIMEOUT_MS: ${SCANNER_REQUEST_TIMEOUT_MS:-3000}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?API_AUTH_TOKEN is required}
      SCANNER_SERVICE_TOKEN: ${SCANNER_SERVICE_TOKEN:?SCANNER_SERVICE_TOKEN is required}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-15000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      SCAN_EXECUTION_TIMEOUT_MS: ${SCAN_EXECUTION_TIMEOUT_MS:-5000}
      SCAN_MAX_ATTEMPTS: ${SCAN_MAX_ATTEMPTS:-3}
      SCAN_RETRY_DELAY_MS: ${SCAN_RETRY_DELAY_MS:-500}
    depends_on:
      scanner:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5173:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [internal]

networks:
  internal:
    driver: bridge

